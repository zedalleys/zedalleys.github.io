name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - name: Build site (assets + Eleventy)
        run: npm run build
      - name: Fail if the committed HTML is stale
        # Only the text output is checked — sharp/libvips can encode PNGs a
        # few bytes differently across platforms, so the generated images
        # aren't diff-gated here.
        run: |
          if ! git diff --quiet -- '*.html' '*.xml' 'journal/'; then
            echo "::error::Generated HTML is out of date — run 'npm run build' and commit the result."
            git --no-pager diff --stat -- '*.html' '*.xml' 'journal/'
            exit 1
          fi
      - name: Validate generated HTML
        run: npm run validate

  learning-hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: _hub/package-lock.json
      - name: Install Learning Hub deps
        run: npm ci
        working-directory: _hub
      - name: Lint Learning Hub
        run: npm run lint
        working-directory: _hub
      - name: Test Learning Hub
        run: npm test
        working-directory: _hub
      - name: Build Learning Hub (type-check + Vite)
        run: npm run build
        working-directory: _hub

  link-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check internal links and image references
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --exclude 'https://.*'
            --root-dir .
            './*.html'
            './journal/**/*.html'

  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build site (assets + Eleventy)
        run: npm run build
      # LHCI serves the built site itself (startServerCommand in
      # lighthouserc.json) and audits a handful of representative pages.
      # Thresholds are "warn" for now: the run reports scores and uploads
      # full reports but doesn't fail the build. Flip the categories to
      # "error" once a green baseline is confirmed, so perf/a11y/SEO
      # regressions block a PR.
      - name: Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true
