version: 2
updates:
  # Site toolchain (Eleventy, sharp, prettier, eslint, html-validate…).
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      site-dev-dependencies:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # The Learning Hub sub-app (React, Vite, Supabase, vitest…).
  - package-ecosystem: npm
    directory: "/_hub"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      hub-dependencies:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # GitHub Actions pinned in .github/workflows.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
